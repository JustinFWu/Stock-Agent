name: CI

# The test suite runs here, which is the point of the job.
#
# This used to lint `stock-agent/src` and stop, with a comment saying to add pytest
# "once a test suite exists" — long after one did. A green check that only proves the
# code parses is worse than no check, because it reads like coverage. Lint now covers
# every authored file, not just `src`, and the suite runs on a clean checkout with no
# bar cache: the tests that need real market data skip themselves.
#
# Every step below takes no path arguments. Lint, types and tests each read their scope
# from `pyproject.toml` or `ruff.toml`, so a bare `ruff check` / `mypy` / `pytest` run
# locally is the same check that runs here. Passing paths on the command line is how CI
# and a developer's shell quietly come to check different things.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable, so the package is importable without any `sys.path` manipulation and the
      # tests import `stock_agent` the same way anything else would.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Rules are pinned in ruff.toml rather than left to ruff's defaults, which grow
      # between releases and would otherwise turn a green branch red on their own.
      - name: Lint
        run: ruff check .

      # Scoped to the execution path; `pyproject.toml` records why.
      - name: Types
        run: mypy

      - name: Byte-compile
        run: python -m compileall -q stock_agent tests

      - name: Tests
        run: pytest
