[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent"
# The minor tracks the roadmap phase, so a checkout says which phase's code it is.
# Phase 4 is in progress, and its gate — thirty clean unattended sessions — is untouched.
version = "0.4.0"
description = "Volatility-targeted equity research pipeline with a cost-aware backtester and a crash-recoverable execution path"
requires-python = ">=3.12"

# Lower bounds only, so a fresh install picks up fixes. What the suite was last verified
# against, for when a future version breaks something:
#
#   Python 3.13.1 / 3.12 in CI
#   pandas 3.0.3   numpy 2.4.6      scikit-learn 1.8.0   xgboost 3.2.0
#   yfinance 1.3.0 pyarrow 24.0.0   joblib 1.5.3
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# The toolchain is a dependency of working on this, not of running it, so it lives here
# rather than beside pandas. CI installs `.[dev]` and nothing else.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-tqdm",
]

[project.scripts]
stock-agent = "stock_agent.pipeline:main"
# A separate entry point on purpose: the research CLI reads the cache and prints numbers,
# this one can place orders. One mistyped flag should not be the difference.
stock-agent-session = "stock_agent.execution.cli:main"

[tool.setuptools.packages.find]
include = ["stock_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default to quiet: the suite is large enough that per-test lines bury the summary.
addopts = "-q"

[tool.mypy]
python_version = "3.12"

# Scoped to the execution path, deliberately, and `files` rather than a CI argument so a
# bare `mypy` locally runs exactly what CI runs — the same reason there is one weight path
# for backtest and live.
#
# Why not the whole tree: a full run reports 93 errors, and reading them, the large majority
# are `pandas-stubs` imprecision rather than defects — `.loc[date]` typed `Series | DataFrame`
# when the caller knows which, and rolling/ewm results typed `ndarray` when they are Series.
# Clearing those means ~50 casts threaded through numeric code that is correct and covered,
# which trades real risk for a green check. The execution path is the opposite case: it is
# plain dataclasses, a Protocol and two state machines, types carry the weight there, and a
# mistake costs money rather than a backtest number. It is clean and it stays clean.
#
# The gate is an allowlist of modules that have been driven to zero, and it grows by
# adding a line here once a module is clean. `follow_imports = "silent"` is what makes that
# possible: imported modules are still read for their real types, so the listed files are
# checked against the truth rather than against Any, but errors inside an unlisted module
# are not reported. Without it, adding one import to the execution path would drag the
# whole numeric stack into the gate and the only way to stay green would be to stop
# checking anything.
follow_imports = "silent"
files = [
    "stock_agent/execution",          # the money path: dataclasses, a Protocol, two state machines
    "stock_agent/backtest/portfolio.py",
    "stock_agent/data/fetcher.py",
    "stock_agent/data/panel.py",
    "stock_agent/strategy/factory.py",
    "stock_agent/strategy/live.py",
    "stock_agent/strategy/weights.py",
]

# Not yet in the gate, and each for the same reason: `momentum.py`, `vol_forecast.py`,
# `engine.py`, `metrics.py`, `labels/target.py`, `features/`, `dataset.py`, `pipeline.py`
# and `tests/`. Between them they account for the errors described above, which are
# dominated by stub imprecision. They are worth taking one module at a time.

# Not `strict`. Strict mode's `disallow_untyped_defs` would demand annotations on every
# test body, which says nothing about correctness, and `disallow_any_expr` is unusable
# against pandas, where almost every expression is an Any. What is turned on below is the
# subset that catches real mistakes in code that is already annotated: a None that is not
# handled, a return type that is wrong, an unreachable branch, a cast that does nothing.
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# The numeric stack ships incomplete or absent stubs, and the alternative to this is 200
# `# type: ignore` comments that would also silence real errors at those call sites.
[[tool.mypy.overrides]]
module = ["yfinance.*", "xgboost.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true
